<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@trg</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --accent: #0a5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0f;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --accent: #6ea8ff;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  main { max-width: 28rem; }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
  }
  p {
    color: var(--muted);
    margin: 0 0 1.75rem;
    line-height: 1.5;
  }
  a.button {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 0.5rem;
    font-weight: 500;
    transition: opacity 0.15s ease;
  }
  a.button:hover { opacity: 0.85; }
</style>
</head>
<body>
<main>
  <h1>@trg</h1>
  <p>This page has moved. Check out the WoWS Companion site instead.</p>
  <a class="button" href="/wows/">Go to WoWS Companion &rarr;</a>
</main>
</body>
</html>
